services:
  - type: web
    name: p2p-signaling-server
    env: node
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: SESSION_EXPIRY_MINUTES
        value: 15
      - key: STUN_SERVER_URL
        value: stun:stun.l.google.com:19302
